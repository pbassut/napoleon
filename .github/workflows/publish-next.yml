name: Publish Next Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  id-token: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if source files changed
        id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '^(src/|bin/|package\.json)'; then
            echo "should-publish=true" >> $GITHUB_OUTPUT
          else
            echo "should-publish=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-changes
    if: needs.check-changes.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Get current version
        id: current-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate next version
        id: next-version
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          
          # Extract base version without prerelease
          BASE_VERSION=$(echo $CURRENT_VERSION | sed 's/-.*$//')
          
          # Create next version with commit SHA
          NEXT_VERSION="${BASE_VERSION}-next.${TIMESTAMP}.${COMMIT_SHA}"
          
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Update package version
        run: |
          npm version ${{ steps.next-version.outputs.version }} --no-git-tag-version

      - name: Publish to npm with @next tag
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: next-${{ steps.next-version.outputs.version }}
          release_name: Next Release ${{ steps.next-version.outputs.version }}
          body: |
            Pre-release build from main branch
            
            Install with: `npm install napoleon-cli@next`
            
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true