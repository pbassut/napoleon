name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Get current version
        id: current-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump-version
        run: |
          npm version ${{ github.event.inputs.version_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.bump-version.outputs.new-version }}"
          title: "Release v${{ steps.bump-version.outputs.new-version }}"
          body: |
            ## 🚀 Release v${{ steps.bump-version.outputs.new-version }}

            This PR bumps the version from v${{ steps.current-version.outputs.version }} to v${{ steps.bump-version.outputs.new-version }}.

            ### Release type: ${{ github.event.inputs.version_type }}

            After merging this PR, create a tag to trigger the stable release:
            ```bash
            git tag v${{ steps.bump-version.outputs.new-version }}
            git push origin v${{ steps.bump-version.outputs.new-version }}
            ```

            This will automatically publish the package to npm with the `@latest` tag.
          branch: release/v${{ steps.bump-version.outputs.new-version }}
          delete-branch: true
          labels: |
            release
            automated